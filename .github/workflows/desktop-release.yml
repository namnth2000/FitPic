name: Desktop Windows release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-desktop-version.cjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run desktop:test
      - name: Build Windows installer and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: FitPic Desktop ${{ github.ref_name }}
          releaseBody: 'Windows x64 installer. All image processing stays on your device. See docs/Desktop.md for installation and release notes.'
          releaseDraft: false
          uploadUpdaterJson: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          args: --bundles nsis -- --locked
